<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | TAWFIQ Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #264E80;
            --accent: #CC5500;
            --bg: #FFFFFF;
            --text: #1e293b;
            --light-text: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Watermark Effect */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            width: 80vw;
            height: 80vw;
            background-image: url('{{ site.baseurl }}/assets/logo.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.03;
            z-index: -1;
            pointer-events: none;
        }

        header {
            background: var(--primary);
            padding: 60px 20px;
            color: white;
            text-align: center;
            border-bottom: 5px solid var(--accent);
            border-radius: 0 0 40px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .header-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        h1 {
            font-weight: 600;
            font-size: 2.5rem;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
        }

        .subtitle {
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: rgba(255,255,255,0.6);
            font-weight: 400;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 24px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
        }

        .content {
            padding-bottom: 100px;
        }

        h2, h3 {
            color: var(--primary);
            margin: 40px 0 20px;
            font-weight: 600;
        }

        p {
            margin-bottom: 20px;
            color: var(--light-text);
        }

        a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.8;
        }

        ul {
            margin: 20px 0 20px 20px;
            color: var(--light-text);
        }

        li {
            margin-bottom: 10px;
        }

        hr {
            border: 0;
            height: 1px;
            background: #e2e8f0;
            margin: 40px 0;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            color: var(--light-text);
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            header { padding: 40px 20px; }
            .logo { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <div class="watermark"></div>
    
    <header>
        <div class="header-content">
            <img src="{{ site.baseurl }}/assets/logo.png" alt="TAWFIQ Logo" class="logo">
            <p class="subtitle">Official Portal</p>
            <h1>{{ page.title }}</h1>
        </div>
    </header>

    <main>
        <div class="content">
            {{ content }}
        </div>
    </main>

    <footer>
        &copy; 2026 TAWFIQ Business Management Suite. All rights reserved.
    </footer>
</body>
</html>
